<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Raise Silken Tofu and Bergie toward two signature dishes—or the true Tofu Bergerdil fusion.">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tofu Bergerdil">
    <title>Tofu Bergerdil Games</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell" id="game">
      <header class="masthead">
        <p class="eyebrow">Raise two heroes across twenty seasons</p>
        <h1>Tofu Bergerdil Games</h1>
      </header>

      <section id="screen" class="card" aria-live="polite"></section>

      <footer class="toolbar" id="toolbar" hidden>
        <button type="button" class="button button--quiet" id="save-button">Save progress</button>
        <button type="button" class="button button--quiet" id="restart-button">Restart</button>
        <span id="save-status" role="status"></span>
      </footer>
      <p class="game-version" aria-label="Game version 7">Game version 7</p>
    </main>
    <noscript>This story needs JavaScript enabled to play.</noscript>
    <script type="module" src="js/app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
